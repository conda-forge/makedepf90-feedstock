{% set name = "makedepf90" %}
{% set version = "3.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # Second URL is snapshot.debian.org's permanent hash-addressed copy, kept as a
  # mirror because the pool drops an .orig tarball when a new upstream lands.
  url:
    - https://deb.debian.org/debian/pool/main/m/{{ name }}/{{ name }}_{{ version }}.orig.tar.xz
    - https://snapshot.debian.org/file/23046d97498c530a7237f7aac237d25c53d4e41a
  sha256: a11601ea14ad793f23fca9c7e7df694b6337f962ccc930d995d72e172edf29ee
  patches:
    # From Debian (science-team/makedepf90), which carries upstream now.
    - patches/std23.patch        # FTBFS under C23 (GCC 15 default): use <stdbool.h>
    - patches/Makefile.in.patch  # drop duplicate .y.h rule (parallel-make race)
    # Reported upstream as Debian bug #1155574.
    - patches/bounds-check-string-buf.patch  # out-of-bounds write on long string literal

build:
  number: 0
  skip: True  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make
    - flex
    - bison

test:
  commands:
    # Full test (binary present + submodule-dependency regression guard) is in
    # recipe/run_test.sh, which conda-build runs automatically.
    - test -f ${PREFIX}/bin/makedepf90

about:
  home: https://salsa.debian.org/science-team/makedepf90
  license: GPL-2.0-only
  license_family: GPL
  license_file: COPYING
  summary: 'Creates Makefile dependency list for Fortran source files.'
  dev_url: https://salsa.debian.org/science-team/makedepf90

extra:
  recipe-maintainers:
    - pera-noaa
    - kburns
